name: Sisteme Sizan Ajanlar Botu
on:
  issues:
    types: [opened]

jobs:
  add-agent:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.title, 'Sisteme Sız')
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Ajan Avatarini Terminale Ekle
        run: |
          USER="${{ github.event.issue.user.login }}"
          AVATAR="<a href=\"https://github.com/$USER\"><img src=\"https://github.com/$USER.png\" width=\"50px\" style=\"border-radius:50%; margin:2px;\" alt=\"$USER\"></a>"
          sed -i "s|<!-- ajanlar-baslangic -->|<!-- ajanlar-baslangic -->\n$AVATAR|" README.md
          
      - name: Sisteme Kaydet (Commit)
        run: |
          git config --global user.name "Siber Terminal Botu"
          git config --global user.email "bot@siberterminal.local"
          git add README.md
          git commit -m "> SİSTEM LOGU: Yeni Ajan Ağa Eklendi: @${{ github.event.issue.user.login }}"
          git push
          
      - name: İzi Yok Et (Issue Kapat)
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '> 🕵️‍♂️ Sisteme girişin onaylandı. Ajan profiline eklendi. Bağlantı kesiliyor...'
            })
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
